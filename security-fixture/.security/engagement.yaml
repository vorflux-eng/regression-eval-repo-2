# Engagement contract for the local fixture run: own fixture, active mode,
# loopback only. Copied to /code/.security/engagement.yaml by the active row.
version: 1
created_at: "2026-11-05"
created_by: "agent@vorflux.com"
approved_by: "agent@vorflux.com"
expires_at: "2026-12-05"
mode: active
# Loopback needs no allowlist, so the state is known. Above `passive` an unknown
# state rejects, because a shared NAT address never proves authorization.
allowlist_state: known
targets:
  - kind: url
    value: "http://127.0.0.1:8000"
    ports: [8000]
    owner: own_fixture
budgets:
  requests_per_host: 20
  max_concurrency: 2
  max_rps: 5
techniques:
  content_discovery: true
  template_scan: true
  # sqlmap runs under `intrusive`; the active row proves F1 with crafted requests.
  sql_injection: "skip"
  default_credentials: "skip"
