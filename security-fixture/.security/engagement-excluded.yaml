# Same fixture, but the second copy of the service on :8001 is excluded. The
# run must never send a request to it even though it is running.
version: 1
created_at: "2026-11-05"
created_by: "agent@vorflux.com"
approved_by: "agent@vorflux.com"
expires_at: "2026-12-05"
mode: active
allowlist_state: unknown
targets:
  - kind: url
    value: "http://127.0.0.1:8000"
    ports: [8000]
    owner: own_fixture
  - kind: url
    value: "http://127.0.0.1:8001"
    ports: [8001]
    owner: own_fixture
exclusions:
  - "127.0.0.1:8001"
  - "http://127.0.0.1:8001/*"
budgets:
  requests_per_host: 20
  max_concurrency: 2
  max_rps: 5
techniques:
  content_discovery: true
  template_scan: true
  sql_injection: "skip"
  default_credentials: "skip"
